# Releash on the Contabo VPS, behind Coolify's Traefik (external network "coolify").
# Lives at /opt/releash. Secrets: /opt/releash/.env.releash (chmod 600, never in git).
# `docker compose up -d` starts web + backend only. Agents are behind the "agents" profile.
x-node: &node
  image: releash-node:latest
  build: { context: ./src, dockerfile: deploy/Dockerfile }
  env_file: .env.releash
  restart: unless-stopped
  volumes: ["./data:/data"]
  logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

x-shared-env: &shared-env
  CHAIN_ID: "46630"
  AGENT_LOG: /data/log.46630.jsonl
  MARKET_FILE: /data/market.46630.json
  DB_PATH: /data/releash-46630.db

services:
  web:
    image: nginx:alpine
    container_name: releash-web
    restart: unless-stopped
    volumes: ["./web/html:/usr/share/nginx/html:ro", "./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    networks: [coolify]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.releash-redir.redirectscheme.scheme: https
      traefik.http.routers.releash-http.entrypoints: http
      traefik.http.routers.releash-http.rule: Host(`releash.robbyn.xyz`)
      traefik.http.routers.releash-http.middlewares: releash-redir
      traefik.http.routers.releash.entrypoints: https
      traefik.http.routers.releash.rule: Host(`releash.robbyn.xyz`)
      traefik.http.routers.releash.tls: "true"
      traefik.http.routers.releash.tls.certresolver: letsencrypt
      traefik.http.services.releash.loadbalancer.server.port: "80"

  backend:
    <<: *node
    container_name: releash-backend
    restart: unless-stopped
    environment:
      <<: *shared-env
      PORT: "8787"
      DEMO_ENABLED: "1"
      WORLD_SIMULATE: "1"
    networks: [coolify]
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.middlewares.releash-api-redir.redirectscheme.scheme: https
      traefik.http.routers.releash-api-http.entrypoints: http
      traefik.http.routers.releash-api-http.rule: Host(`releash-api.robbyn.xyz`)
      traefik.http.routers.releash-api-http.middlewares: releash-api-redir
      traefik.http.routers.releash-api.entrypoints: https
      traefik.http.routers.releash-api.rule: Host(`releash-api.robbyn.xyz`)
      traefik.http.routers.releash-api.tls: "true"
      traefik.http.routers.releash-api.tls.certresolver: letsencrypt
      traefik.http.services.releash-api.loadbalancer.server.port: "8787"

  # ---- agents: prepared, NOT started by `up -d`. Start with deploy/agents.sh start ----
  loop:
    <<: *node
    container_name: releash-loop
    profiles: [agents]
    restart: unless-stopped # explicit: survives docker/VPS restarts even if the anchor changes
    working_dir: /app/agent
    command: ["node_modules/.bin/tsx", "loop.ts"]
    environment: { <<: *shared-env }

  liquidator:
    <<: *node
    container_name: releash-liquidator
    profiles: [agents]
    restart: unless-stopped # explicit: survives docker/VPS restarts even if the anchor changes
    working_dir: /app/agent
    command: ["node_modules/.bin/tsx", "liquidator.ts"]
    environment: { <<: *shared-env }

  keeper:
    <<: *node
    container_name: releash-keeper
    profiles: [agents]
    restart: unless-stopped # explicit: survives docker/VPS restarts even if the anchor changes
    working_dir: /app/agent
    command: ["node_modules/.bin/tsx", "keeper.ts", "tick"]
    environment: { <<: *shared-env }

networks:
  coolify:
    external: true
